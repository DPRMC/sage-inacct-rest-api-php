name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, libxml, mbstring, pdo, pdo_sqlite, xml, xmlwriter
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.php }}" = "8.1" ]; then
            composer update --no-interaction --prefer-dist --with-all-dependencies
          else
            composer install --no-interaction --prefer-dist
          fi

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Run syntax checks
        run: composer syntax

      - name: Regenerate generated SDK
        run: composer generate:sage

      - name: Verify generated SDK is committed
        run: git diff --exit-code -- resources/generated src/Generated

      - name: Run tests
        run: composer test
